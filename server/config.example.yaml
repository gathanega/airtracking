# Salin ke config.yaml lalu isi. Jangan di-commit.
supabase:
  url: "https://ISI_PROJECT_REF.supabase.co"
  service_key: "ISI_SERVICE_ROLE_KEY"   # hanya di server
cors_origins: ["*"]                     # ganti dengan domain dashboard bila sudah live
mqtt:                                   # hapus blok ini bila belum pakai MQTT
  host: "ISI_HOST_BROKER"
  port: 1883
  username: ""
  password: ""
  topic: "airtracking/+/data"           # alat publish ke airtracking/<ID_ALAT>/data
